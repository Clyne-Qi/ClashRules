ruby_edit "$CONFIG_FILE" "['proxy-groups'].find{|g| g['name']=='🔰 节点选择'}['proxies']" "begin base=['♻️ 自动选择','🇭🇰 香港节点','🇺🇸 美国节点','🇯🇵 日本节点','🇨🇳 台湾节点','🇸🇬 新加坡节点','🇲🇾 马来西亚节点','🇰🇷 韩国节点']; names=(Value['proxies']||[]).map{|p| p.is_a?(Hash) ? p['name'] : nil}.compact; extras=names.select{|n| n !~ /🇭🇰|香港|Hong.?Kong|(?:^|[^A-Za-z])HK(?:[^A-Za-z]|$)|🇺🇸|美国|美國|United States|(?:^|[^A-Za-z])US(?:[^A-Za-z]|$)|🇯🇵|日本|Japan|(?:^|[^A-Za-z])JP(?:[^A-Za-z]|$)|🇹🇼|台湾|臺灣|Taiwan|(?:^|[^A-Za-z])TW(?:[^A-Za-z]|$)|🇸🇬|新加坡|狮城|獅城|Singapore|(?:^|[^A-Za-z])SG(?:[^A-Za-z]|$)|🇲🇾|马来西亚|馬來西亞|Malaysia|(?:^|[^A-Za-z])MY(?:[^A-Za-z]|$)|🇰🇷|韩国|韓國|Korea|(?:^|[^A-Za-z])KR(?:[^A-Za-z]|$)/i && n !~ /剩余|流量|到期|套餐|官网|订阅|客服/}; base+extras+['DIRECT'] end"
