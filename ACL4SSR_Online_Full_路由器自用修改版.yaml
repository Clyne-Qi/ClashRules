[YAML]

# ============================================================
# Clyne-Qi / OpenClash 增量覆写规则
#
# 设计：
# 1. 保留机场订阅原有节点、策略组与 rules。
# 2. 新增个人分流策略组并前置对应规则；订阅原有分流组由上方 [Overwrite] 改为地区组选择。
# 3. 地区节点列表由上方 [Overwrite] 在启动时从机场真实 proxies 动态生成。
# 4. 新增分流组默认跟随“🔰 节点选择”；该组选择地区后，在地区组内手动选择具体节点。
# 5. Steam 单独分组：国内下载/CDN 直连，商店/社区/创意工坊页面跟随统一选择。
# 6. Pixiv 单独分组：pixiv.net / pximg.net / fanbox.cc 跟随统一选择。
# 7. PS5（192.168.6.250）：TCP / UDP 全部直连，用于排查代理分流对连接质量的影响。
# ============================================================

# 家中访问 clyne.top:5001 时直连 NAS，避开公网地址回流。
hosts:
  clyne.top: 192.168.6.100
dns:
  use-hosts: true
  fake-ip-filter+:
    - clyne.top

proxy-groups+:

  # OpenAI / ChatGPT：默认跟随统一选择
  - name: 💬 OpenAI
    type: select
    proxies:
      - 🔰 节点选择
      - 🇭🇰 香港节点
      - 🇺🇸 美国节点
      - 🇯🇵 日本节点
      - 🇨🇳 台湾节点
      - 🇸🇬 新加坡节点
      - 🇲🇾 马来西亚节点
      - 🇰🇷 韩国节点
      - 🌍 其他节点
      - ♻️ 自动选择
      - DIRECT
  # Google：默认跟随统一选择
  - name: 🔎 Google
    type: select
    proxies:
      - 🔰 节点选择
      - 🇭🇰 香港节点
      - 🇺🇸 美国节点
      - 🇯🇵 日本节点
      - 🇨🇳 台湾节点
      - 🇸🇬 新加坡节点
      - 🇲🇾 马来西亚节点
      - 🇰🇷 韩国节点
      - 🌍 其他节点
      - ♻️ 自动选择
      - DIRECT
  # 📹 油管视频：默认跟随统一选择
  - name: 📹 油管视频
    type: select
    proxies:
      - 🔰 节点选择
      - 🇭🇰 香港节点
      - 🇺🇸 美国节点
      - 🇯🇵 日本节点
      - 🇨🇳 台湾节点
      - 🇸🇬 新加坡节点
      - 🇲🇾 马来西亚节点
      - 🇰🇷 韩国节点
      - 🌍 其他节点
      - ♻️ 自动选择
      - DIRECT
  # 💻 GitHub：默认跟随统一选择
  - name: 💻 GitHub
    type: select
    proxies:
      - 🔰 节点选择
      - 🇭🇰 香港节点
      - 🇺🇸 美国节点
      - 🇯🇵 日本节点
      - 🇨🇳 台湾节点
      - 🇸🇬 新加坡节点
      - 🇲🇾 马来西亚节点
      - 🇰🇷 韩国节点
      - 🌍 其他节点
      - ♻️ 自动选择
      - DIRECT
  # Pixiv：默认跟随统一选择
  - name: 🎨 Pixiv
    type: select
    proxies:
      - 🔰 节点选择
      - 🇭🇰 香港节点
      - 🇺🇸 美国节点
      - 🇯🇵 日本节点
      - 🇨🇳 台湾节点
      - 🇸🇬 新加坡节点
      - 🇲🇾 马来西亚节点
      - 🇰🇷 韩国节点
      - 🌍 其他节点
      - ♻️ 自动选择
      - DIRECT
  # Steam：默认跟随统一选择（仅商店/社区等非下载流量）
  - name: 🎮 Steam
    type: select
    proxies:
      - 🔰 节点选择
      - 🇭🇰 香港节点
      - 🇺🇸 美国节点
      - 🇯🇵 日本节点
      - 🇨🇳 台湾节点
      - 🇸🇬 新加坡节点
      - 🇲🇾 马来西亚节点
      - 🇰🇷 韩国节点
      - 🌍 其他节点
      - ♻️ 自动选择
      - DIRECT
  # 其他游戏平台：默认跟随统一选择
  - name: 🕹️ 游戏平台
    type: select
    proxies:
      - 🔰 节点选择
      - 🇭🇰 香港节点
      - 🇺🇸 美国节点
      - 🇯🇵 日本节点
      - 🇨🇳 台湾节点
      - 🇸🇬 新加坡节点
      - 🇲🇾 马来西亚节点
      - 🇰🇷 韩国节点
      - 🌍 其他节点
      - ♻️ 自动选择
      - DIRECT
  # 地区组：没有匹配节点时显示 REJECT，避免无意直连
  - name: 🇭🇰 香港节点
    type: select
    proxies:
      - REJECT
  - name: 🇺🇸 美国节点
    type: select
    proxies:
      - REJECT
  - name: 🇯🇵 日本节点
    type: select
    proxies:
      - REJECT
  - name: 🇨🇳 台湾节点
    type: select
    proxies:
      - REJECT
  - name: 🇸🇬 新加坡节点
    type: select
    proxies:
      - REJECT
  - name: 🇲🇾 马来西亚节点
    type: select
    proxies:
      - REJECT
  - name: 🇰🇷 韩国节点
    type: select
    proxies:
      - REJECT
  - name: 🌍 其他节点
    type: select
    proxies:
      - REJECT
# 前置规则：优先于机场订阅原有 rules
+rules:

  # 家中访问自建域名时走内网 NAS
  - DOMAIN,clyne.top,DIRECT

  # PS5（192.168.6.250）全部直连
  - AND,((SRC-IP-CIDR,192.168.6.250/32),(NETWORK,UDP)),DIRECT
  - AND,((SRC-IP-CIDR,192.168.6.250/32),(NETWORK,TCP)),DIRECT

  # OpenAI / ChatGPT
  - DOMAIN-SUFFIX,chatgpt.com,💬 OpenAI
  - DOMAIN-SUFFIX,openai.com,💬 OpenAI
  - DOMAIN-SUFFIX,oaistatic.com,💬 OpenAI
  - DOMAIN-SUFFIX,oaiusercontent.com,💬 OpenAI
  - GEOSITE,openai,💬 OpenAI

  # 📹 油管视频 放在 Google 前面
  - GEOSITE,youtube,📹 油管视频

  # Google
  - GEOSITE,google,🔎 Google

  # 💻 GitHub
  - DOMAIN-SUFFIX,github.com,💻 GitHub
  - DOMAIN-SUFFIX,githubusercontent.com,💻 GitHub
  - DOMAIN-SUFFIX,githubassets.com,💻 GitHub
  - GEOSITE,github,💻 GitHub

  # Pixiv / FANBOX：跟随统一选择
  # 参考 ACL4SSR Pixiv.list：pixiv.net / pximg.net / fanbox.cc
  - DOMAIN-SUFFIX,pixiv.net,🎨 Pixiv
  - DOMAIN-SUFFIX,pximg.net,🎨 Pixiv
  - DOMAIN-SUFFIX,fanbox.cc,🎨 Pixiv
  - DOMAIN-SUFFIX,ads-pixiv.net,🎨 Pixiv

  # Steam 国内下载/CDN：直连
  # 参考 ACL4SSR 的 SteamCN 规则，必须放在 Steam 总规则之前。
  - DOMAIN,csgo.wmsj.cn,DIRECT
  - DOMAIN,dl.steam.clngaa.com,DIRECT
  - DOMAIN,dl.steam.ksyna.com,DIRECT
  - DOMAIN,dota2.wmsj.cn,DIRECT
  - DOMAIN,st.dl.bscstorage.net,DIRECT
  - DOMAIN,st.dl.eccdnx.com,DIRECT
  - DOMAIN,st.dl.pinyuncloud.com,DIRECT
  - DOMAIN,steampipe.steamcontent.tnkjmec.com,DIRECT
  - DOMAIN,steampowered.com.8686c.com,DIRECT
  - DOMAIN,steamstatic.com.8686c.com,DIRECT
  - DOMAIN,wmsjsteam.com,DIRECT
  - DOMAIN,xz.pphimalayanrt.com,DIRECT
  - DOMAIN-SUFFIX,cm.steampowered.com,DIRECT
  - DOMAIN-SUFFIX,steamchina.com,DIRECT
  - DOMAIN-SUFFIX,steamcontent.com,DIRECT
  - DOMAIN-SUFFIX,steamusercontent.com,DIRECT

  # Steam 商店 / 社区 / 创意工坊页面等：跟随统一选择
  - GEOSITE,steam,🎮 Steam

  # 其他游戏平台
  - GEOSITE,epicgames,🕹️ 游戏平台
  - GEOSITE,origin,🕹️ 游戏平台
  - GEOSITE,ea,🕹️ 游戏平台
  - GEOSITE,sony,🕹️ 游戏平台
  - GEOSITE,playstation,🕹️ 游戏平台
  - GEOSITE,nintendo,🕹️ 游戏平台
