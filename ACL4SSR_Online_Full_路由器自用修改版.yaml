[Overwrite]

# 运行时从机场订阅的 proxies 中读取真实节点名，并写入对应策略组。
# 不再依赖 Mihomo/OpenClash 的 include-all-proxies + filter。
# 若未筛到目标节点，则回退到机场原有“节点选择”策略组，避免配置失效。

ruby_edit "$CONFIG_FILE" "['proxy-groups'].find{|g| g['name']=='OpenAI-US'}['proxies']" "begin names=(Value['proxies']||[]).map{|p| p.is_a?(Hash) ? p['name'] : nil}.compact.select{|n| n =~ /(\u7f8e\u56fd|\u7f8e\u570b|United States)/i && n !~ /(v3|10\u500d|5\u500d|5x)/i}; fallback=(Value['proxy-groups']||[]).find{|g| g.is_a?(Hash) && g['name'].to_s =~ /\u8282\u70b9\u9009\u62e9/}; names.empty? ? [fallback&&fallback['name']].compact : names end"
ruby_edit "$CONFIG_FILE" "['proxy-groups'].find{|g| g['name']=='Google-US'}['proxies']" "begin names=(Value['proxies']||[]).map{|p| p.is_a?(Hash) ? p['name'] : nil}.compact.select{|n| n =~ /(\u7f8e\u56fd|\u7f8e\u570b|United States)/i && n !~ /(v3|10\u500d|5\u500d|5x)/i}; fallback=(Value['proxy-groups']||[]).find{|g| g.is_a?(Hash) && g['name'].to_s =~ /\u8282\u70b9\u9009\u62e9/}; names.empty? ? [fallback&&fallback['name']].compact : names end"
ruby_edit "$CONFIG_FILE" "['proxy-groups'].find{|g| g['name']=='YouTube'}['proxies']" "begin names=(Value['proxies']||[]).map{|p| p.is_a?(Hash) ? p['name'] : nil}.compact.select{|n| n =~ /(\u9999\u6e2f|\u65e5\u672c|\u7f8e\u56fd|\u7f8e\u570b|United States)/i && n !~ /(v3|10\u500d|5\u500d|5x)/i}; fallback=(Value['proxy-groups']||[]).find{|g| g.is_a?(Hash) && g['name'].to_s =~ /\u8282\u70b9\u9009\u62e9/}; names.empty? ? [fallback&&fallback['name']].compact : names end"
ruby_edit "$CONFIG_FILE" "['proxy-groups'].find{|g| g['name']=='GitHub'}['proxies']" "begin names=(Value['proxies']||[]).map{|p| p.is_a?(Hash) ? p['name'] : nil}.compact.select{|n| n =~ /(\u9999\u6e2f|\u7f8e\u56fd|\u7f8e\u570b|United States)/i && n !~ /(v3|10\u500d|5\u500d|5x)/i}; fallback=(Value['proxy-groups']||[]).find{|g| g.is_a?(Hash) && g['name'].to_s =~ /\u8282\u70b9\u9009\u62e9/}; names.empty? ? [fallback&&fallback['name']].compact : names end"
ruby_edit "$CONFIG_FILE" "['proxy-groups'].find{|g| g['name']=='Pixiv-All'}['proxies']" "(Value['proxies']||[]).map{|p| p.is_a?(Hash) ? p['name'] : nil}.compact"
ruby_edit "$CONFIG_FILE" "['proxy-groups'].find{|g| g['name']=='Steam-HK-JP'}['proxies']" "begin names=(Value['proxies']||[]).map{|p| p.is_a?(Hash) ? p['name'] : nil}.compact.select{|n| n =~ /(\u9999\u6e2f|\u65e5\u672c)/i && n !~ /(v3|10\u500d|5\u500d|5x)/i}; fallback=(Value['proxy-groups']||[]).find{|g| g.is_a?(Hash) && g['name'].to_s =~ /\u8282\u70b9\u9009\u62e9/}; names.empty? ? [fallback&&fallback['name']].compact : names end"
