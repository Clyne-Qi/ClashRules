[Overwrite]
# OpenClash 覆写模块：从订阅节点动态填充地区组，其他地区节点直接列入总选择。
# “🔰 节点选择”可选地区或其他地区的具体节点；地区组内选具体节点。直连规则仍保持原有直连。
ruby_edit "$CONFIG_FILE" "['proxy-groups'].find{|g| g['name']=='🇭🇰 香港节点'}['proxies']" "begin ns=(Value['proxies']||[]).map{|p| p.is_a?(Hash) ? p['name'] : nil}.compact.select{|n| n =~ /🇭🇰|香港|Hong.?Kong|(?:^|[^A-Za-z])HK(?:[^A-Za-z]|$)/i}; ns.empty? ? ['REJECT'] : ns end"
ruby_edit "$CONFIG_FILE" "['proxy-groups'].find{|g| g['name']=='🇺🇸 美国节点'}['proxies']" "begin ns=(Value['proxies']||[]).map{|p| p.is_a?(Hash) ? p['name'] : nil}.compact.select{|n| n =~ /🇺🇸|美国|美國|United States|(?:^|[^A-Za-z])US(?:[^A-Za-z]|$)/i}; ns.empty? ? ['REJECT'] : ns end"
ruby_edit "$CONFIG_FILE" "['proxy-groups'].find{|g| g['name']=='🇯🇵 日本节点'}['proxies']" "begin ns=(Value['proxies']||[]).map{|p| p.is_a?(Hash) ? p['name'] : nil}.compact.select{|n| n =~ /🇯🇵|日本|Japan|(?:^|[^A-Za-z])JP(?:[^A-Za-z]|$)/i}; ns.empty? ? ['REJECT'] : ns end"
ruby_edit "$CONFIG_FILE" "['proxy-groups'].find{|g| g['name']=='🇨🇳 台湾节点'}['proxies']" "begin ns=(Value['proxies']||[]).map{|p| p.is_a?(Hash) ? p['name'] : nil}.compact.select{|n| n =~ /🇹🇼|台湾|臺灣|Taiwan|(?:^|[^A-Za-z])TW(?:[^A-Za-z]|$)/i}; ns.empty? ? ['REJECT'] : ns end"
ruby_edit "$CONFIG_FILE" "['proxy-groups'].find{|g| g['name']=='🇸🇬 新加坡节点'}['proxies']" "begin ns=(Value['proxies']||[]).map{|p| p.is_a?(Hash) ? p['name'] : nil}.compact.select{|n| n =~ /🇸🇬|新加坡|狮城|獅城|Singapore|(?:^|[^A-Za-z])SG(?:[^A-Za-z]|$)/i}; ns.empty? ? ['REJECT'] : ns end"
ruby_edit "$CONFIG_FILE" "['proxy-groups'].find{|g| g['name']=='🇲🇾 马来西亚节点'}['proxies']" "begin ns=(Value['proxies']||[]).map{|p| p.is_a?(Hash) ? p['name'] : nil}.compact.select{|n| n =~ /🇲🇾|马来西亚|馬來西亞|Malaysia|(?:^|[^A-Za-z])MY(?:[^A-Za-z]|$)/i}; ns.empty? ? ['REJECT'] : ns end"
ruby_edit "$CONFIG_FILE" "['proxy-groups'].find{|g| g['name']=='🇰🇷 韩国节点'}['proxies']" "begin ns=(Value['proxies']||[]).map{|p| p.is_a?(Hash) ? p['name'] : nil}.compact.select{|n| n =~ /🇰🇷|韩国|韓國|Korea|(?:^|[^A-Za-z])KR(?:[^A-Za-z]|$)/i}; ns.empty? ? ['REJECT'] : ns end"

