[YAML]

# ============================================================
# Clyne-Qi / OpenClash 增量覆写规则
#
# 设计：
# 1. 保留机场订阅原有节点、策略组与 rules。
# 2. 新增个人分流策略组并前置对应规则；订阅原有分流组由上方 [Overwrite] 改为地区组选择。
# 3. 地区组和总选择中的其他地区节点由上方 [Overwrite] 从机场真实 proxies 动态生成。
# 4. 新增分流组默认跟随“🔰 节点选择”；该组可选择地区，也可直接选择其他地区的具体节点。
# 5. Steam 单独分组：国内下载/CDN 直连，商店/社区/创意工坊页面跟随统一选择。
# 6. Pixiv 单独分组：pixiv.net / pximg.net / fanbox.cc 跟随统一选择。
# 7. PS5（192.168.6.250）：游戏下载/系统更新直连；其余流量（商店、登录、联机等）走“🎮 PlayStation”策略组。
# ============================================================

# 家中访问 clyne.top:5001 时直连 NAS，避开公网地址回流。
hosts:
  clyne.top: 192.168.6.100
dns:
  use-hosts: true
  fake-ip-filter+:
    - clyne.top

# 允许外网通过动态公网 IP 打开的 Dashboard 调用 Mihomo Controller。
# CORS 不是鉴权机制，实际访问安全仍由 Dashboard / Controller secret 等负责。
external-controller-cors:
  allow-origins:
    - "*"
  allow-private-network: true

proxy-groups+:

  # OpenAI / ChatGPT：默认跟随统一选择
  - name: 💬 OpenAI
    type: select
    proxies:
      - 🔰 节点选择
      - 🇭🇰 香港节点
      - 🇺🇸 美国节点
      - 🇯🇵 日本节点
      - 🇨🇳 台湾节点
      - 🇸🇬 新加坡节点
      - 🇲🇾 马来西亚节点
      - 🇰🇷 韩国节点
      - ♻️ 自动选择
      - DIRECT
  # Google：默认跟随统一选择
  - name: 🔎 Google
    type: select
    proxies:
      - 🔰 节点选择
      - 🇭🇰 香港节点
      - 🇺🇸 美国节点
      - 🇯🇵 日本节点
      - 🇨🇳 台湾节点
      - 🇸🇬 新加坡节点
      - 🇲🇾 马来西亚节点
