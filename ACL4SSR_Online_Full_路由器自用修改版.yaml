# 动态公网 IP 远程 Dashboard：通过 Ruby 写入 CORS，避免覆写模块 YAML 对 "*" 的解析兼容问题。
ruby_edit "$CONFIG_FILE" "['external-controller-cors']" "{'allow-origins'=>['*'],'allow-private-network'=>true}"

# 策略组显示顺序：地区组紧跟在“♻️ 自动选择”后面，方便直接测速/切换。
ruby_edit "$CONFIG_FILE" "['proxy-groups']" "begin regions=['🇭🇰 香港节点','🇺🇸 美国节点','🇯🇵 日本节点','🇨🇳 台湾节点','🇸🇬 新加坡节点','🇲🇾 马来西亚节点','🇰🇷 韩国节点']; gs=(Value['proxy-groups']||[]); moved=gs.select{|g| g.is_a?(Hash) && regions.include?(g['name'])}; rest=gs.reject{|g| g.is_a?(Hash) && regions.include?(g['name'])}; idx=rest.index{|g| g.is_a?(Hash) && g['name']=='♻️ 自动选择'}; idx ? rest[0..idx]+moved+rest[(idx+1)..-1].to_a : rest+moved end"
[YAML]

# ============================================================
# Clyne-Qi / OpenClash 增量覆写规则
#
# 设计：
# 1. 保留机场订阅原有节点、策略组与 rules。
# 2. 地区组和总选择由 [Overwrite] 从机场真实 proxies 动态生成。
# 3. AI 使用机场原版“🤖 AI 服务”策略组；仅将可选项整理为地区大组，不创建额外 AI 策略组。
# 4. 仅保留指向机场“🤖 AI 服务”的前置 AI 域名规则，避免 Google / GitHub 等大规则抢先命中。
# 5. 普通 Google / YouTube / GitHub / Pixiv 继续独立分流。
# 6. Steam / Epic / EA / Xbox / PlayStation / Nintendo 合并为“🎮 游戏服务”，默认香港。
# 7. Steam 国内下载/CDN 直连；PS5（192.168.6.250）游戏下载/系统更新直连，
#    其余 PS5 TCP / UDP 流量走“🎮 游戏服务”。
# 8. 策略组显示顺序将地区组移动到“♻️ 自动选择”之后；“🛑 全球拦截”默认 REJECT。
# 9. 外网 Dashboard CORS 通过 [Overwrite] Ruby 写入通配 Origin；实际安全仍依赖 Controller secret 等鉴权。
# ============================================================

# 家中访问 clyne.top:5001 时直连 NAS，避开公网地址回流。
hosts:
  clyne.top: 192.168.6.100
dns:
  use-hosts: true
  fake-ip-filter+:
    - clyne.top

proxy-groups+:

  # 普通 Google：AI 域名会在 rules 中提前送往机场原版“🤖 AI 服务”。
  - name: 🔎 Google
    type: select
    proxies:
      - 🔰 节点选择
      - 🇭🇰 香港节点
      - 🇺🇸 美国节点
      - 🇯🇵 日本节点
      - 🇨🇳 台湾节点
      - 🇸🇬 新加坡节点
      - 🇲🇾 马来西亚节点
      - 🇰🇷 韩国节点
      - ♻️ 自动选择
      - DIRECT

  - name: 📹 油管视频
    type: select
    proxies:
      - 🔰 节点选择
      - 🇭🇰 香港节点
      - 🇺🇸 美国节点
      - 🇯🇵 日本节点
      - 🇨🇳 台湾节点
      - 🇸🇬 新加坡节点
      - 🇲🇾 马来西亚节点
      - 🇰🇷 韩国节点
      - ♻️ 自动选择
      - DIRECT

  - name: 💻 GitHub
    type: select
    proxies:
      - 🔰 节点选择
      - 🇭🇰 香港节点
      - 🇺🇸 美国节点
      - 🇯🇵 日本节点
      - 🇨🇳 台湾节点
      - 🇸🇬 新加坡节点
      - 🇲🇾 马来西亚节点
      - 🇰🇷 韩国节点
      - ♻️ 自动选择
      - DIRECT

  - name: 🎨 Pixiv
    type: select
    proxies:
      - 🔰 节点选择
      - 🇭🇰 香港节点
      - 🇺🇸 美国节点
      - 🇯🇵 日本节点
      - 🇨🇳 台湾节点
      - 🇸🇬 新加坡节点
      - 🇲🇾 马来西亚节点
      - 🇰🇷 韩国节点
      - ♻️ 自动选择
      - DIRECT

  # 所有游戏平台统一，第一项即默认香港。
  - name: 🎮 游戏服务
    type: select
    proxies:
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇺🇸 美国节点
      - 🇨🇳 台湾节点
      - 🇸🇬 新加坡节点
      - 🇲🇾 马来西亚节点
      - 🇰🇷 韩国节点
      - 🔰 节点选择
      - ♻️ 自动选择
      - DIRECT

  # 地区组：具体节点由 [Overwrite] 动态填充。
  - name: 🇭🇰 香港节点
    type: select
    proxies:
      - REJECT
  - name: 🇺🇸 美国节点
    type: select
    proxies:
      - REJECT
  - name: 🇯🇵 日本节点
    type: select
    proxies:
      - REJECT
  - name: 🇨🇳 台湾节点
    type: select
    proxies:
      - REJECT
  - name: 🇸🇬 新加坡节点
    type: select
    proxies:
      - REJECT
  - name: 🇲🇾 马来西亚节点
    type: select
    proxies:
      - REJECT
  - name: 🇰🇷 韩国节点
    type: select
    proxies:
      - REJECT

# 前置规则：优先于机场订阅原有 rules。
+rules:

  # 文印123 接单网站：网页及该主域名下的请求直连，不经过代理。
  - DOMAIN-SUFFIX,wenyin123.com,DIRECT
  # 家中访问自建域名时走内网 NAS。
  - DOMAIN,clyne.top,DIRECT

  # NAS qBittorrent（192.168.6.100）：
  # 8085 为 Web UI；20000 为 BT 监听端口（TCP/UDP）。
  # 对涉及这两个源/目标端口的 NAS 流量强制 DIRECT，避免误入机场代理。
  - AND,((SRC-IP-CIDR,192.168.6.100/32),(SRC-PORT,8085/20000)),DIRECT
  - AND,((SRC-IP-CIDR,192.168.6.100/32),(DST-PORT,8085/20000)),DIRECT

  # PS5（192.168.6.250）：
  # 家庭局域网直连；游戏下载/系统更新直连；其余商店/登录/联机等走游戏组。
  - AND,((SRC-IP-CIDR,192.168.6.250/32),(IP-CIDR,192.168.6.0/24)),DIRECT
  - DOMAIN-SUFFIX,dl.playstation.net,DIRECT
  - DOMAIN-SUFFIX,update.playstation.net,DIRECT
  - AND,((SRC-IP-CIDR,192.168.6.250/32),(NETWORK,UDP)),🎮 游戏服务
  - AND,((SRC-IP-CIDR,192.168.6.250/32),(NETWORK,TCP)),🎮 游戏服务

  # AI：统一交给机场原版“🤖 AI 服务”策略组。
