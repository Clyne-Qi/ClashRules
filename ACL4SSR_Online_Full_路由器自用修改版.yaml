[YAML]

# ============================================================
# Clyne-Qi / OpenClash 增量覆写规则
#
# 用途：
# 1. 保留机场订阅原有节点、策略组与 rules，不整体替换。
# 2. 仅追加下面几个策略组，并将指定规则前置到原订阅 rules。
# 3. OpenAI / Google 只提供美国节点，手动选择。
# 4. YouTube 只提供香港 / 日本 / 美国节点，手动选择。
# 5. GitHub 只提供香港 / 美国节点，手动选择。
# 6. 游戏平台只提供香港 / 日本节点，手动选择具体线路。
#
# 说明：
# - 策略组名使用 ASCII，避免部分 OpenClash 环境对中文/Emoji 名称处理异常。
# - 节点筛选改用 exclude-filter 反向白名单，兼容当前 Mihomo/OpenClash 实际行为。
# - 非目标地区节点，以及 v3 / 5倍 / 10倍等高倍率节点默认排除。
# ============================================================


# ------------------------------------------------------------
# 新增策略组
# ------------------------------------------------------------

proxy-groups+:

  # OpenAI / ChatGPT：只显示美国节点，手动选择
  - name: OpenAI-US
    type: select
    include-all-proxies: true
    filter: "(?i)美国|美國|United States"

  # Google：只显示美国节点，手动选择
  - name: Google-US
    type: select
    include-all-proxies: true
    filter: "(?i)美国|美國|United States"

  # YouTube：只显示香港 / 日本 / 美国节点，手动选择
  - name: YouTube-Auto
    type: select
    include-all-proxies: true
    filter: "(?i)香港|日本|美国|美國|United States"

  # GitHub：只显示香港 / 美国节点，手动选择
  - name: GitHub-Auto
    type: select
    include-all-proxies: true
    filter: "(?i)香港|美国|美國|United States"

  # 游戏平台：只显示香港 / 日本节点，手动选择具体线路
  - name: Game-HK-JP
    type: select
    include-all-proxies: true
    filter: "(?i)香港|日本"


# ------------------------------------------------------------
# 前置规则
# OpenClash 的 +rules 会把这些规则插入机场原有 rules 的最前面。
# ------------------------------------------------------------

+rules:

  # ----- OpenAI / ChatGPT -----
  # 显式域名优先写在 GeoSite 前，避免 chatgpt.com 再掉入漏网之鱼。
  - DOMAIN-SUFFIX,chatgpt.com,OpenAI-US
  - DOMAIN-SUFFIX,openai.com,OpenAI-US
  - DOMAIN-SUFFIX,oaistatic.com,OpenAI-US
  - DOMAIN-SUFFIX,oaiusercontent.com,OpenAI-US
  - GEOSITE,openai,OpenAI-US

  # ----- YouTube -----
  # 放在 Google 前面，避免 YouTube 流量先被 Google 大类规则命中。
  - GEOSITE,youtube,YouTube-Auto

  # ----- Google -----
  - GEOSITE,google,Google-US

  # ----- GitHub -----
  # 显式覆盖网页、Raw、静态资源与下载域名，再由 GeoSite 补充其余域名。
  - DOMAIN-SUFFIX,github.com,GitHub-Auto
  - DOMAIN-SUFFIX,githubusercontent.com,GitHub-Auto
  - DOMAIN-SUFFIX,githubassets.com,GitHub-Auto
  - GEOSITE,github,GitHub-Auto

  # ----- 游戏平台 -----
  - GEOSITE,steam,Game-HK-JP
  - GEOSITE,epicgames,Game-HK-JP
  - GEOSITE,origin,Game-HK-JP
  - GEOSITE,ea,Game-HK-JP
  - GEOSITE,sony,Game-HK-JP
  - GEOSITE,playstation,Game-HK-JP
  - GEOSITE,nintendo,Game-HK-JP
